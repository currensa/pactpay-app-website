name: Deploy Website

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deploy target environment
        required: true
        default: production
        type: choice
        options:
          - production
          - test

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    env:
      IMAGE_ENV_PREFIX: ${{ inputs.environment == 'production' && 'PROD' || 'TEST' }}
      CVM_HOST: ${{ inputs.environment == 'production' && secrets.CVM_HOST || secrets.CVM_HOST_TEST }}
      CVM_USERNAME: ${{ inputs.environment == 'production' && secrets.CVM_USERNAME || secrets.CVM_USERNAME_TEST }}
      CVM_SSH_KEY: ${{ inputs.environment == 'production' && secrets.CVM_SSH_KEY || secrets.CVM_SSH_KEY_TEST }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate timestamp tag
        id: tag
        run: echo "IMAGE_TAG=$(date -u +'%Y%m%d_%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: sgccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: sgccr.ccs.tencentyun.com/pactpay/pactpay-app-website:${{ env.IMAGE_ENV_PREFIX }}_${{ steps.tag.outputs.IMAGE_TAG }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Deploy to CVM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.CVM_HOST }}
          username: ${{ env.CVM_USERNAME }}
          key: ${{ env.CVM_SSH_KEY }}
          script: |
            IMAGE="sgccr.ccs.tencentyun.com/pactpay/pactpay-app-website:${{ env.IMAGE_ENV_PREFIX }}_${{ steps.tag.outputs.IMAGE_TAG }}"
            CONTAINER="pactpay-app-website"

            echo "${{ secrets.TCR_PASSWORD }}" | docker login sgccr.ccs.tencentyun.com \
              --username "${{ secrets.TCR_USERNAME }}" \
              --password-stdin

            docker pull "$IMAGE"

            docker stop "$CONTAINER" || true
            docker rm "$CONTAINER" || true

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 3001:80 \
              "$IMAGE"
