name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate timestamp tag
        id: tag
        run: echo "IMAGE_TAG=$(date -u +'%Y%m%d_%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent Cloud Registry
        uses: docker/login-action@v3
        with:
          registry: sgccr.ccs.tencentyun.com
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: sgccr.ccs.tencentyun.com/pactpay/pactpay-app-website:PROD_${{ steps.tag.outputs.IMAGE_TAG }}

      - name: Deploy to CVM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CVM_HOST_PROD }}
          username: ${{ secrets.CVM_USERNAME }}
          key: ${{ secrets.CVM_SSH_KEY }}
          script: |
            IMAGE="sgccr.ccs.tencentyun.com/pactpay/pactpay-app-website:PROD_${{ steps.tag.outputs.IMAGE_TAG }}"
            CONTAINER="pactpay-app-website"

            echo "${{ secrets.TCR_PASSWORD }}" | docker login sgccr.ccs.tencentyun.com \
              --username "${{ secrets.TCR_USERNAME }}" \
              --password-stdin

            docker pull "$IMAGE"

            docker stop "$CONTAINER" || true
            docker rm "$CONTAINER" || true

            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 80:80 \
              "$IMAGE"
