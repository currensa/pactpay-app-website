server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # HTML 走协商缓存：no-cache 让浏览器每次请求时携带 ETag/Last-Modified 校验，
  # 未变化时 nginx 返回 304，不传输 body
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # Vite 产物带内容 hash，可安全长期缓存
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 其他静态资源（字体、图标等）同样长期缓存
  location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|ico|webp|gif)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA 路由回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}